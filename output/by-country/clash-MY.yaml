port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
- name: 🇲🇾 MY 01 - xiaohe
  type: vless
  server: forwarded.frnhk.xyz
  port: 46003
  uuid: 6006c9a2-c0a2-4cda-80f2-405b0d790fc8
  udp: true
  tls: false
  skip-cert-verify: true
  network: ws
  ws-opts:
    path: /my1023
    headers:
      Host: forwarded.frnhk.xyz
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - FALLBACK
  - 🇲🇾 MY 01 - xiaohe
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  tolerance: 100
  lazy: true
  proxies: &id001
  - 🇲🇾 MY 01 - xiaohe
- name: FALLBACK
  type: fallback
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  lazy: true
  proxies: *id001
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- MATCH,PROXIES
