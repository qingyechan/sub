port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
- name: 🇨🇾 CY 01 - xiaohe
  type: vless
  server: 216.24.57.225
  port: 2087
  uuid: 825a76ef-053f-41eb-ba81-411e29494251
  udp: true
  tls: true
  skip-cert-verify: true
  servername: busstop.zandix.ir
  network: ws
  ws-opts:
    path: /wss
