port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
- name: 🇨🇾 CY 01 - xiaohe
  type: vless
  server: 5.253.29.254
  port: 10443
  uuid: c7c27192-60a5-4ce1-b613-95270d82309d
  udp: true
  tls: false
  skip-cert-verify: true
- name: 🇨🇾 CY 02 - xiaohe
  type: vless
  server: 5.253.29.254
  port: 14430
  uuid: c7c27192-60a5-4ce1-b613-95270d82309d
  udp: true
  tls: false
  skip-cert-verify: true
  network: ws
  ws-opts:
    path: /vless
    headers:
      Host: 5.253.29.254
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - FALLBACK
  - 🇨🇾 CY 01 - xiaohe
  - 🇨🇾 CY 02 - xiaohe
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  tolerance: 100
  lazy: true
  proxies: &id001
  - 🇨🇾 CY 01 - xiaohe
  - 🇨🇾 CY 02 - xiaohe
- name: FALLBACK
  type: fallback
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  lazy: true
  proxies: *id001
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- MATCH,PROXIES
