port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
- name: 🇵🇱 PL 01 - xiaohe
  type: vless
  server: 5.22.221.127
  port: 443
  uuid: 44dfa3a7-f648-4587-819b-e653c0823f28
  udp: true
  tls: false
  skip-cert-verify: true
- name: 🇵🇱 PL 02 - xiaohe
  type: vless
  server: 2.26.6.1
  port: 2087
  uuid: b9fdc03f-389b-4cda-9be4-155b623bee15
  udp: true
  tls: true
  skip-cert-verify: true
  servername: 2.26.6.1
- name: 🇵🇱 PL 03 - xiaohe
  type: vless
  server: tr2.soft10.ir
  port: 2053
  uuid: 480b4042-f713-43d7-b24b-b4064c97f841
