proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - FALLBACK
  - 🇵🇱 PL 01 - xiaohe
  - 🇵🇱 PL 02 - xiaohe
  - 🇵🇱 PL 03 - xiaohe
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  tolerance: 100
  lazy: true
  proxies: &id001
  - 🇵🇱 PL 01 - xiaohe
  - 🇵🇱 PL 02 - xiaohe
  - 🇵🇱 PL 03 - xiaohe
- name: FALLBACK
  type: fallback
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  lazy: true
  proxies: *id001
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- MATCH,PROXIES
