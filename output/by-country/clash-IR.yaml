port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
- name: 🇮🇷 IR 01 - xiaohe
  type: vless
  server: s10.redmbred.ir
  port: 37857
  uuid: 43d5b705-f33e-4d43-8540-b2de5f309117
  udp: true
  tls: false
  skip-cert-verify: true
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - FALLBACK
  - 🇮🇷 IR 01 - xiaohe
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  tolerance: 100
  lazy: true
  proxies: &id001
  - 🇮🇷 IR 01 - xiaohe
- name: FALLBACK
  type: fallback
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 600
  timeout: 8000
  lazy: true
  proxies: *id001
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- MATCH,PROXIES
