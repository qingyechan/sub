name: Update Subscriptions

on:
  schedule:
    # 错开整点，每小时刷新，减少免费节点失效后的滞留时间
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['scripts/main.py', 'scripts/requirements.txt', 'config/mobile-approved.yaml']
  workflow_dispatch: # 支持手动点击运行

concurrency:
  group: subscription-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Regression Tests
        run: python -m unittest discover -s tests -v

      - name: Run Real-Prober and Classifier
        run: |
          python scripts/main.py

      - name: Save Downloadable Subscriptions
        uses: actions/upload-artifact@v4
        with:
          name: subscriptions
          path: output/
          retention-days: 3

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Refresh Primary CDN Subscriptions
        continue-on-error: true
        timeout-minutes: 2
        run: |
          for file in clash-mobile.yaml mobile-status.json clash.yaml clash-tested.yaml clash-history.yaml clash-fast.yaml singbox.json v2ray.txt status.json; do
            curl --fail --show-error --max-time 15 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/output/${file}"
          done
